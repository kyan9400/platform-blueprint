name: Bug report
description: Report a reproducible platform problem
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include credentials, kubeconfig contents, or Terraform state.
  - type: input
    id: component
    attributes:
      label: Component
      placeholder: Flux, Flagger, policy, observability, Terraform
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include the commands and sanitized output needed to reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: OS, Kubernetes version, tool versions
    validations:
      required: true
