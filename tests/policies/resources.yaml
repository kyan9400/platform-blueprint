apiVersion: v1
kind: Pod
metadata:
  name: compliant
  namespace: platform-policy-test
spec:
  containers:
    - image: ghcr.io/stefanprodan/podinfo:6.14.1@sha256:f9537f729129d339aaef049b76ab2cd4ff06a424f99e5f6a5923c10621018fb1
      name: app
      resources:
        limits:
          cpu: 500m
          memory: 256Mi
        requests:
          cpu: 100m
          memory: 64Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        runAsNonRoot: true
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
---
