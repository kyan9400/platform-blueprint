apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: platform-workload-standards
policies:
  - ../../policies/workload-standards.yaml
resources:
  - resources.yaml
results:
  - isValidatingPolicy: true
    kind: Pod
    policy: platform-workload-standards
    resources:
      - platform-policy-test/compliant
    result: pass
  - isValidatingPolicy: true
    kind: Pod
    policy: platform-workload-standards
    resources:
      - platform-policy-test/unsafe-pod-context
      - platform-policy-test/unsafe-container-context
      - platform-policy-test/unsafe-resources
      - platform-policy-test/unsafe-image
    result: fail
