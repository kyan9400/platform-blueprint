apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target:
      group: helm.toolkit.fluxcd.io
      kind: HelmRelease
      name: podinfo
      version: v2
    patch: |-
      - op: replace
        path: /spec/values/ui/message
        value: Local GitOps canary
