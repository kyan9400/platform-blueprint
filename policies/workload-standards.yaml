apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: platform-workload-standards
  annotations:
    policies.kyverno.io/category: Platform security
    policies.kyverno.io/description: >-
      Enforces the minimum runtime, resource, and image controls for platform workloads.
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
spec:
  evaluation:
    admission:
      enabled: true
    background:
      enabled: true
  failurePolicy: Fail
  matchConditions:
    - expression: object.metadata.namespace.startsWith('platform-')
      name: platform-namespace
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods
  validationActions:
    - Deny
  validations:
    - expression: >-
        has(object.spec.securityContext) &&
        has(object.spec.securityContext.runAsNonRoot) &&
        object.spec.securityContext.runAsNonRoot &&
        has(object.spec.securityContext.seccompProfile) &&
        object.spec.securityContext.seccompProfile.type == 'RuntimeDefault'
      message: Pods must run as non-root with the RuntimeDefault seccomp profile.
    - expression: >-
        variables.allContainers.all(container,
          has(container.securityContext) &&
          has(container.securityContext.runAsNonRoot) &&
          container.securityContext.runAsNonRoot &&
          has(container.securityContext.allowPrivilegeEscalation) &&
          !container.securityContext.allowPrivilegeEscalation &&
          has(container.securityContext.capabilities) &&
          has(container.securityContext.capabilities.drop) &&
          container.securityContext.capabilities.drop.exists(capability, capability == 'ALL'))
      message: Containers must be non-root, drop Linux capabilities, and block privilege escalation.
    - expression: >-
        variables.allContainers.all(container,
          has(container.resources) &&
          has(container.resources.requests) &&
          has(container.resources.requests.cpu) &&
          has(container.resources.requests.memory) &&
          has(container.resources.limits) &&
          has(container.resources.limits.cpu) &&
          has(container.resources.limits.memory))
      message: Containers must declare CPU and memory requests and limits.
    - expression: >-
        variables.allContainers.all(container, container.image.contains('@sha256:'))
      message: Workload images must be pinned to a sha256 digest.
  variables:
    - expression: >-
        object.spec.containers +
        object.spec.?initContainers.orValue([]) +
        object.spec.?ephemeralContainers.orValue([])
      name: allContainers
