apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: platform-workload-standards
  annotations:
    policies.kyverno.io/category: Platform security
    policies.kyverno.io/description: >-
      Enforces the minimum runtime and resource controls for platform workloads.
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
spec:
  admission: true
  background: true
  emitWarning: false
  rules:
    - match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - platform-*
      name: require-pod-security-context
      validate:
        allowExistingViolations: false
        failureAction: Enforce
        message: Pods must run as non-root with the RuntimeDefault seccomp profile.
        pattern:
          spec:
            securityContext:
              runAsNonRoot: true
              seccompProfile:
                type: RuntimeDefault
    - match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - platform-*
      name: require-container-security-context
      validate:
        allowExistingViolations: false
        failureAction: Enforce
        foreach:
          - list: request.object.spec.containers
            pattern:
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                runAsNonRoot: true
        message: Containers must be non-root, drop Linux capabilities, and block privilege escalation.
    - match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - platform-*
      name: require-resource-bounds
      validate:
        allowExistingViolations: false
        failureAction: Enforce
        foreach:
          - list: request.object.spec.containers
            pattern:
              resources:
                limits:
                  cpu: "?*"
                  memory: "?*"
                requests:
                  cpu: "?*"
                  memory: "?*"
        message: Containers must declare CPU and memory requests and limits.
    - match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - platform-*
      name: disallow-latest-image-tag
      validate:
        allowExistingViolations: false
        failureAction: Enforce
        foreach:
          - list: request.object.spec.containers
            pattern:
              image: "!*:latest"
        message: Workload images must use an explicit, non-latest version.
