apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: kyverno
spec:
  chart:
    spec:
      chart: kyverno
      sourceRef:
        kind: HelmRepository
        name: kyverno
        namespace: flux-system
      version: 3.9.0
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  interval: 30m
  releaseName: kyverno
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    admissionController:
      replicas: 1
      container:
        resources:
          limits:
            cpu: 500m
            memory: 384Mi
          requests:
            cpu: 100m
            memory: 128Mi
    backgroundController:
      resources:
        limits:
          cpu: 300m
          memory: 256Mi
        requests:
          cpu: 50m
          memory: 96Mi
    cleanupController:
      resources:
        limits:
          cpu: 200m
          memory: 192Mi
        requests:
          cpu: 50m
          memory: 64Mi
    reportsController:
      resources:
        limits:
          cpu: 300m
          memory: 256Mi
        requests:
          cpu: 50m
          memory: 96Mi
